# Netlify deploy config.
# The Next.js runtime plugin handles the App Router build output automatically.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Set NEXT_PUBLIC_SITE_URL in the Netlify UI (Site settings → Environment variables)
  # once the final domain is known — it drives canonical URLs, sitemap.xml and robots.txt.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
